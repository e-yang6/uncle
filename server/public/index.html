<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uncle</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 34rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    button { font-size: 1rem; padding: .6rem 1rem; margin: .25rem .25rem .25rem 0; }
    label { display: block; margin: .25rem 0; }
    pre { background: #f2f2f2; padding: .75rem; overflow-x: auto; font-size: .85rem; }
    #status { min-height: 3.5rem; }
  </style>
</head>
<body>
  <h1>Uncle: voice test</h1>
  <p>One line, spoken by a stock voice, then aged by our own filter. Compare them.</p>

  <button id="raw">Play original</button>
  <button id="aged">Play aged</button>

  <label for="strength">How aged: <output id="strengthOut">1.0</output></label>
  <input id="strength" type="range" min="0" max="1" step="0.05" value="1" style="width:100%">

  <label for="sex">Voice type for the pitch change</label>
  <select id="sex">
    <option value="neutral">unknown (no pitch change)</option>
    <option value="male">male (pitch rises a little)</option>
    <option value="female">female (pitch drops a little)</option>
  </select>

  <fieldset>
    <legend>Turn effects OFF (to find what sounds wrong)</legend>
    <label><input type="checkbox" class="off" value="wobble"> wobble</label>
    <label><input type="checkbox" class="off" value="pace"> slower pace</label>
    <label><input type="checkbox" class="off" value="tone"> duller tone</label>
    <label><input type="checkbox" class="off" value="pitch"> pitch change</label>
  </fieldset>

  <p id="status"></p>
  <details><summary>Server features</summary><pre id="health">checking…</pre></details>

  <script>
    const $ = (id) => document.getElementById(id);
    const status = $("status");

    fetch("/health").then(r => r.json()).then(j => {
      $("health").textContent = JSON.stringify(j.features, null, 2);
    });
    $("strength").addEventListener("input", () => { $("strengthOut").textContent = Number($("strength").value).toFixed(2); });

    async function play(raw) {
      status.textContent = "Loading…";
      const t0 = performance.now();
      const q = new URLSearchParams({ strength: $("strength").value, sex: $("sex").value });
      if (raw) q.set("raw", "1");
      const off = [...document.querySelectorAll(".off:checked")].map((c) => c.value);
      if (off.length) q.set("off", off.join(","));
      const res = await fetch("/api/voice/test?" + q);
      if (!res.ok) {
        const j = await res.json().catch(() => ({}));
        status.textContent = "Not working: " + (j.error || res.status);
        return;
      }
      const blob = await res.blob();
      const audio = new Audio(URL.createObjectURL(blob));
      const readyMs = Math.round(performance.now() - t0);
      await audio.play();
      const h = (n) => res.headers.get(n);
      status.textContent =
        `${raw ? "Original" : "Aged"} playing. Click to audio ready: ${readyMs} ms. ` +
        `ElevenLabs first byte: ${h("x-tts-ttfb-ms")} ms, total: ${h("x-tts-total-ms")} ms` +
        `${h("x-tts-cached") === "true" ? " (cached from the first play)" : ""}. ` +
        `Aging filter: ${h("x-filter-ms")} ms.`;
    }
    $("raw").onclick = () => play(true);
    $("aged").onclick = () => play(false);
  </script>
</body>
</html>
