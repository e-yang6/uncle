<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uncle charts</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef2ed;color:#25332b;font:16px/1.5 Arial,sans-serif}main{max-width:1200px;margin:auto;padding:32px 20px}h1{font-size:26px;font-weight:600;margin:0 0 4px}p{color:#65736b;margin:0 0 24px}.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}figure{margin:0;border:1px solid #dfe6e0;background:#fafbf9}canvas{display:block;width:100%;height:auto}@media(max-width:720px){.charts{grid-template-columns:1fr}}
</style></head><body><main><h1>Projections</h1><p id="sample-note"></p><div class="charts" id="charts"></div></main>
<script type="module">
import {drawChart} from './charts.js';
import {isCard,drawCard} from './cards.js';
const response=await fetch('./sample/charts.json');const sample=await response.json();
document.getElementById('sample-note').textContent='Sample simulation · '+sample.profile.name;
for(const chart of Object.values(sample.charts)){
 const figure=document.createElement('figure'),canvas=document.createElement('canvas');
 canvas.width=1200;canvas.height=800;canvas.setAttribute('aria-label',chart.title||chart.kind);
 figure.append(canvas);document.getElementById('charts').append(figure);
 (isCard(chart)?drawCard:drawChart)(canvas.getContext('2d'),chart,canvas.width,canvas.height);
}
window.chartsReady=true;
</script></body></html>
